</style><script>/* Local export adapter: memory-only state and DOM controls, with no application bridge. */
(() => {
  const handlers = new Set();
  window.RaccoonHost = {
    language: document.documentElement.lang,
    snapshot: { data: null, design: {} },
    subscribe(fn) {
      handlers.add(fn);
      return () => handlers.delete(fn);
    },
    send(message) {
      if (message.type !== 'design-register') return;
      const panel = document.getElementById('raccoon-export-controls');
      if (!panel) return;
      panel.replaceChildren();
      for (const field of message.fields) {
        const label = document.createElement('label');
        const caption = document.createElement('span');
        caption.textContent = field.label;
        const control = document.createElement(field.kind === 'select' ? 'select' : 'input');
        if (field.kind === 'select') {
          field.options.forEach(value => {
            const option = document.createElement('option');
            option.textContent = option.value = value;
            control.append(option);
          });
        } else {
          control.type = { range: 'range', color: 'color', toggle: 'checkbox' }[field.kind];
          if (field.kind === 'range') {
            control.min = field.min;
            control.max = field.max;
            control.step = field.step;
          }
          if (field.kind === 'toggle') control.checked = field.value;
        }
        control.value = String(field.value);
        control.onchange = () =>
          handlers.forEach(fn =>
            fn({
              type: 'design-change',
              id: field.id,
              value:
                field.kind === 'toggle'
                  ? control.checked
                  : field.kind === 'range'
                    ? Number(control.value)
                    : control.value,
            }),
          );
        label.append(caption, control);
        panel.append(label);
      }
    },
  };
})();

</style><script>/* Raccoon Work visualization helpers. No network, native access, or model invocation. */
(() => {
  const host = window.RaccoonHost;
  const groups = new Map();
  const listeners = new Set();
  const languageListeners = new Set();
  const snapshot = host?.snapshot || { data: null, design: {} };
  let language = host?.language || document.documentElement.lang || 'zh';
  const clone = value => JSON.parse(JSON.stringify(value));
  const labels = {
    zh: { previous: '上一个方案', next: '下一个方案', variant: '设计方案' },
    en: { previous: 'Previous design', next: 'Next design', variant: 'Design option' },
    ja: { previous: '前のデザイン', next: '次のデザイン', variant: 'デザイン案' },
  };
  const text = () => labels[language.split('-')[0]] || labels.en;

    const serialized = JSON.stringify(snapshot);
    if (new TextEncoder().encode(serialized).length > 16384)
      throw new RangeError('Visualization state exceeds 16 KiB');
    host?.send({ type: 'snapshot', snapshot: JSON.parse(serialized) });
  };

    if (field.kind === 'range')
      return (
        typeof value === 'number' &&
        Number.isFinite(value) &&
        value >= field.min &&
        value <= field.max

    if (field.kind === 'color') return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value);

    [...groups.values()].flatMap(group =>
      group.fields.map(field => ({
        ...field,
        id: `${group.id}/${field.key}`,
        label: `${group.label} · ${field.label}`,
        value: group.values[field.key],
        initial: group.initial[field.key],
      })),
    );
  const register = () => host?.send({ type: 'design-register', fields: descriptors() });
  host?.subscribe(message => {
    if (message.language) {
      language = message.language;
      languageListeners.forEach(fn => fn(language));
    }
    if (message.type !== 'design-change') return;
    for (const group of groups.values()) {
      const field = group.fields.find(item => `${group.id}/${item.key}` === message.id);
      if (!field || !valid(field, message.value)) continue;

      register();

    get language() {
      return language;
    },
    get state() {

    },

    onState(fn) {

        Math.abs(difference) <= Number.EPSILON * Math.max(1, Math.abs(costA), Math.abs(costB)) * 4;

        costA,
        costB,
        difference: equal ? 0 : difference,
        savings: equal ? 0 : Math.abs(difference),
        winner: equal ? 'tie' : difference < 0 ? 'A' : 'B',
        crossing,
        side:

        distance: crossing === null ? null : atCrossing ? 0 : Math.abs(crossing - quantity),

    polyline(points, { closed = false } = {}) {

        !Array.isArray(points) ||
        points.length < 2 ||
        !Array.from(points).every(
          point =>
            Array.isArray(point) &&
            point.length === 2 &&
            Number.isFinite(point[0]) &&
            Number.isFinite(point[1]),

        last = path[path.length - 1];

          current = path[index];

        points: path,
        length,
        distanceAt(index) {

        },
        pointAt(distance) {
          if (!Number.isFinite(distance)) throw new TypeError('Polyline distance must be finite');

            const segment = distances[index] - distances[index - 1];

              b = path[index];
            const fraction = (position - distances[index - 1]) / segment;
            return {
              x: a[0] + (b[0] - a[0]) * fraction,
              y: a[1] + (b[1] - a[1]) * fraction,
              angle: Math.atan2(b[1] - a[1], b[0] - a[0]),

        currentControls().map(control => [

            checked: control.checked,

(()=>{const root=document.getElementById('hl-app'),screen=root.querySelector('#hla-screen'),overlay=root.querySelector('#hla-overlay');const people=[{id:1,name:'Avery',age:22,major:'Architecture',year:'Year 4',bio:'Always sketching city corners. Looking for someone who will wander around Sheung Wan and rate the cafés with me.',interests:['Coffee','Art','Hiking'],prompt:'A bookshop, then sunset at the harbour.',question:'My ideal first date',color:'#da8a98',glyph:'A',motif:'slow Sunday walks'},{id:2,name:'Jordan',age:23,major:'Computer Science',year:'Postgraduate',bio:'Bad at small talk, great at finding tiny neighbourhood noodle shops. I host low-stakes board game nights.',interests:['Food','Games','Music'],prompt:'The playlist I made for the MTR.',question:'Ask me about',color:'#7c9ab8',glyph:'J',motif:'one more game?'},{id:3,name:'Mika',age:21,major:'Psychology',year:'Year 3',bio:'Trying to read more fiction and see more of Hong Kong. Come join me for a gentle hike or a gallery afternoon.',interests:['Books','Hiking','Art'],prompt:'Kindness to waiters and strangers.',question:'A green flag',color:'#a4b698',glyph:'M',motif:'take the scenic route'},{id:4,name:'Sam',age:24,major:'Law',year:'Postgraduate',bio:'My perfect weekend has dim sum, live music, and absolutely no email. Passionate amateur photographer.',interests:['Music','Food','Photography'],prompt:'An excellent recommendation.',question:'The way to my heart',color:'#b295bb',glyph:'S',motif:'after the last song'},{id:5,name:'Riley',age:22,major:'Medicine',year:'Year 4',bio:'Early morning swimmer and late-night trivia enthusiast. Looking for a thoughtful plus-one to discover the city.',interests:['Swimming','Games','Coffee'],prompt:'Breakfast is the best meal.',question:'A hill I will die on',color:'#c99b7f',glyph:'R',motif:'meet by the sea'},{id:6,name:'Taylor',age:21,major:'Business',year:'Year 3',bio:'Collector of second-hand books and obscure film recommendations. Usually exploring a new corner of the island.',interests:['Books','Film','Food'],prompt:'A film you still think about.',question:'Tell me about',color:'#9c9bc2',glyph:'T',motif:'new city stories'}];const options=['Coffee','Art','Hiking','Food','Games','Music','Books','Photography','Swimming','Film'];const s={tab:'discover',likes:new Set(),matches:new Set(),passed:new Set(),blocked:new Set(),search:'',filter:'All',profile:{name:'',age:'',major:'',bio:'',interests:[]}};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function flash(text){root.querySelector('#hla-toast').innerHTML='<div class="toast">'+esc(text)+'</div>';clearTimeout(flash.t);flash.t=setTimeout(()=>root.querySelector('#hla-toast').innerHTML='',3000)}function art(p){return '<div class="art" style="--art:'+p.color+'"><div class="initial">'+p.glyph+'</div><div class="art-caption">'+esc(p.motif)+'</div></div>'}function available(){return people.filter(p=>!s.passed.has(p.id)&&!s.blocked.has(p.id)&&!s.likes.has(p.id)&&(!s.search||[p.name,p.major,p.bio,...p.interests].join(' ').toLowerCase().includes(s.search.toLowerCase()))&&(s.filter==='All'||p.interests.includes(s.filter)))}function discover(){let list=available(),p=list[0];screen.innerHTML='<section class="review-strip"><div class="mark">Independent student concept</div><h2>Find common ground, beyond the classroom.</h2><p>A considered way for adult students to discover people through shared interests and conversation prompts.</p><div class="proof"><span>Interest-led discovery</span><span>Mutual connections</span><span>Safety by design</span></div></section><div class="topline"><div><div class="kicker">Explore the concept</div><h1>Discover</h1></div><span class="pill">'+list.length+' to explore</span></div><div class="filters"><input id="hla-search" type="search" aria-label="Search profiles" placeholder="Search people or interests" value="'+esc(s.search)+'"><select id="hla-filter" aria-label="Filter by interest"><option>All</option>'+options.map(x=>'<option '+(x===s.filter?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div id="hla-deck">'+(p?'<div class="deck"><article class="profile-card">'+art(p)+'<div class="card-copy"><div class="name">'+esc(p.name)+', '+p.age+'</div><div class="meta">'+esc(p.major)+' · '+esc(p.year)+'</div><p>'+esc(p.bio)+'</p><div class="prompt"><small>'+esc(p.question)+'</small>'+esc(p.prompt)+'</div><div class="chips">'+p.interests.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div></article><div class="actions"><button class="round pass" data-pass="'+p.id+'" aria-label="Pass on '+esc(p.name)+'" title="Pass">×</button><button class="round detail" data-detail="'+p.id+'" aria-label="See '+esc(p.name)+'’s full profile" title="Full profile">⌄</button><button class="round like" data-like="'+p.id+'" aria-label="Like '+esc(p.name)+'" title="Like">♥</button></div><div class="hintline">Pass · See more · Like</div></div>':'<div class="empty"><div class="symbol">♡</div><h2>That’s everyone for now</h2><p class="small">Try another interest or clear your search.</p><button class="secondary" data-clear style="margin-top:17px">Clear filters</button></div>')+'</div><div class="panel-note"><strong>Prototype boundaries</strong>All profiles are fictional and the matching outcome is simulated. No accounts, messages or data are sent. A real launch requires identity and age checks, privacy controls and moderation.</div><div class="safety">Independent concept, not affiliated with or endorsed by HKU. Adults 18+ only.</div>'}function collection(which){let list=people.filter(p=>!s.blocked.has(p.id)&&(which==='likes'?s.likes.has(p.id):s.matches.has(p.id)));screen.innerHTML='<div class="topline"><div><div class="kicker">Your connections</div><h1>'+(which==='likes'?'Likes':'Matches')+'</h1></div><span class="pill">'+list.length+'</span></div><div class="list">'+(list.length?list.map(p=>'<div class="list-item"><div class="avatar" style="background:'+p.color+'">'+p.glyph+'</div><div class="text"><strong>'+esc(p.name)+', '+p.age+'</strong><span>'+(s.matches.has(p.id)?'A mutual spark ✦':'You liked '+esc(p.name))+'</span></div><button data-detail="'+p.id+'">View</button></div>').join(''):'<div class="empty" style="margin:0"><div class="symbol">♡</div><h2>'+(which==='likes'?'No likes yet':'No matches yet')+'</h2><p class="small">A good connection starts with curiosity.</p><button class="primary" data-tab="discover" style="margin-top:16px">Discover people</button></div>')+'</div><div class="info-box">'+(which==='likes'?'Demo note: Avery and Mika like you back. A like from you creates a sample mutual match.':'A mutual match is demonstrated locally. Messaging and contact with real people are not enabled.')+'</div>'}function profile(){let p=s.profile;screen.innerHTML='<div class="topline"><div><div class="kicker">Make it yours</div><h1>Your profile</h1></div></div><div class="form"><p class="small">Saved only in this demo session. Do not enter contact details.</p><div class="field"><label for="hla-name">Display name</label><input id="hla-name" maxlength="40" placeholder="Your name" value="'+esc(p.name)+'"></div><div class="field"><label for="hla-age">Age · 18 or older</label><input id="hla-age" type="number" min="18" max="99" placeholder="22" value="'+esc(p.age)+'"></div><div class="field"><label for="hla-major">Field of study</label><input id="hla-major" maxlength="60" placeholder="e.g. Engineering" value="'+esc(p.major)+'"></div><div class="field"><label for="hla-bio">Your story</label><textarea id="hla-bio" maxlength="180" placeholder="What are you curious about?">'+esc(p.bio)+'</textarea></div><div class="field"><label>Interests</label><div class="interests">'+options.map(x=>'<button type="button" data-interest="'+x+'" aria-pressed="'+p.interests.includes(x)+'">'+x+'</button>').join('')+'</div></div><div class="error" id="hla-error" role="alert"></div><button class="primary" data-save>Save profile</button></div><div class="safety">Launch criteria: verified adult accounts, consent and privacy controls, abuse reporting with human moderation, and a secure backend. This presentation is not a live service.</div>'}function render(){root.querySelectorAll('.bottom [data-tab]').forEach(b=>{if(b.dataset.tab===s.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});root.querySelector('#hla-likes').textContent=s.likes.size?'· '+s.likes.size:'';root.querySelector('#hla-matches').textContent=s.matches.size?'· '+s.matches.size:'';if(s.tab==='discover')discover();else if(s.tab==='profile')profile();else collection(s.tab);screen.scrollTop=0}function detail(id){let p=people.find(x=>x.id===id);if(!p)return;overlay.innerHTML='<div class="sheet-back"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="hla-title"><div class="sheet-head"><div><div class="kicker">Get to know me</div><h2 id="hla-title">'+esc(p.name)+', '+p.age+'</h2><p class="small">'+esc(p.major)+' · '+esc(p.year)+'</p></div><button class="close" data-close aria-label="Close profile">×</button></div>'+art(p)+'<p>'+esc(p.bio)+'</p><div class="prompt"><small>'+esc(p.question)+'</small>'+esc(p.prompt)+'</div><div class="chips">'+p.interests.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><div class="sheet-actions"><button class="primary" data-like="'+p.id+'">'+(s.likes.has(p.id)?'Remove like':'♥ Like '+esc(p.name))+'</button><button class="secondary" data-pass="'+p.id+'">Pass</button><button class="secondary" data-block="'+p.id+'">Block</button></div><p class="small" style="margin-top:16px">Demo-only controls. No report is sent.</p></section></div>';overlay.querySelector('[data-close]').focus()}function close(){overlay.innerHTML=''}root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){s.tab=b.dataset.tab;close();render()}else if(b.dataset.detail)detail(+b.dataset.detail);else if(b.hasAttribute('data-close'))close();else if(b.dataset.like){let id=+b.dataset.like;if(s.likes.has(id)){s.likes.delete(id);s.matches.delete(id);flash('Like removed')}else{s.likes.add(id);if(id===1||id===3){s.matches.add(id);flash('It’s a match! Find them in Matches ♥')}else flash('Added to your likes')}close();render()}else if(b.dataset.pass){s.passed.add(+b.dataset.pass);close();render();flash('Passed for now')}else if(b.dataset.block){let id=+b.dataset.block;s.blocked.add(id);s.likes.delete(id);s.matches.delete(id);close();render();flash('Profile blocked locally')}else if(b.hasAttribute('data-clear')){s.search='';s.filter='All';render()}else if(b.dataset.interest){let x=b.dataset.interest;if(s.profile.interests.includes(x))s.profile.interests=s.profile.interests.filter(y=>y!==x);else s.profile.interests.push(x);b.setAttribute('aria-pressed',s.profile.interests.includes(x))}else if(b.hasAttribute('data-save')){let name=root.querySelector('#hla-name').value.trim(),age=Number(root.querySelector('#hla-age').value),major=root.querySelector('#hla-major').value.trim(),bio=root.querySelector('#hla-bio').value.trim(),error=root.querySelector('#hla-error');if(!name||!Number.isInteger(age)||age<18||age>99||!major||!bio){error.textContent='Enter a name, age 18–99, field of study and your story.';return}s.profile={...s.profile,name,age,major,bio};error.textContent='';flash('Profile saved for this session')}});root.addEventListener('input',e=>{if(e.target.id==='hla-search'){s.search=e.target.value;let pos=e.target.selectionStart;discover();let input=root.querySelector('#hla-search');input.focus();input.setSelectionRange(pos,pos)}});root.addEventListener('change',e=>{if(e.target.id==='hla-filter'){s.filter=e.target.value;discover()}});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.innerHTML)close()});overlay.addEventListener('click',e=>{if(e.target.classList.contains('sheet-back'))close()});render()})();
</script></div></body></html>
